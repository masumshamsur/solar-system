name: Solar System Workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

env:
  MONGO_URI: "mongodb+srv://supercluster.d83jj.mongodb.net/superData"
  MONGO_USERNAME: ${{ vars.MONGO_USERNAME }}
  MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}     

jobs:
  unit-testing:
    name: Unit Testing
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        ports:
          - 27017:27017
    env:
      MONGO_URI: "mongodb://localhost:27017/superData"
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password 
    strategy:
        matrix:
            node: [18, 20]
            os: [ubuntu-latest]
            exclude:
            - node: 18
              os: macos-latest
    runs-on: ${{ matrix.os }} # Use the matrix OS         
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup NodeJS Version - ${{ matrix.node}}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node}}

      - name: Cache node modules
        uses: actions/cache@v3
        with:
          path: node_modules      # npm cache files are stored in node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}    
      
      - name: Install Dependencies
        run: npm install

      - name: Unit Testing
        id: nodejs-unit-testing-shams011725
        run: npm test

      - name: Archive Test Result
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: Mocha-Test Result
          path: test-results.xml        

  code-coverage:
    name: Code Coverage
    container: 
      image: node:18
    services:
      mongo-db:
        image: siddharth67/mongo-db:non-prod
        options: 
          --name mongo
    env:
      MONGO_URI: "mongodb://mongo:27017/superData"
      MONGO_USERNAME: non-prod-user
      MONGO_PASSWORD: non-prod-password
    runs-on: ubuntu-latest      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # - name: Setup NodeJS Version - 18
      #   uses: actions/setup-node@v3
      #   with:
      #     node-version: 18

      - name: Cache node modules
        uses: actions/cache@v3
        with:
            path: node_modules      # npm cache files are stored in node_modules
            key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}  
                      

      - name: Install Dependencies
        run: npm install

      - name: Check code coverage
        continue-on-error: true
        run: npm run coverage

      - name: Archive Test Result
        uses: actions/upload-artifact@v3
        with:
          name: Code-Coverage-Result
          path: coverage    
          retention-days: 5
   
  docker:
    name: Containerization
    needs: [unit-testing, code-coverage]
    runs-on: ubuntu-latest
    permissions:
      packages: write    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4     
        
      - name: dockerhub login
        uses: docker/login-action@v3  
        with:
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: GHCR login
        uses: docker/login-action@v3  
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}    

      - name: Docker image Build for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: ${{ vars.DOCKER_USERNAME}}/solar-system:${{ github.sha}} 

      - name: Docker Image Testing
        run: |
           docker images
           docker run --name solar-system-app -d \
                -p 3000:3000 \
                -e MONGO_URI=$MONGO_URI \
                -e MONGO_USERNAME=$MONGO_USERNAME \
                -e MONGO_PASSWORD=$MONGO_PASSWORD \
               ${{ vars.DOCKER_USERNAME}}/solar-system:${{ github.sha}} 

           export IP=$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' solar-system-app)
           echo $IP

           echo Testing Image URL using wget
           wget -q -O - 127.0.0.1:3000/live | grep live

      - name: Contrainer Registry push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.DOCKER_USERNAME}}/solar-system:${{ github.sha}} 
            ghcr.io/${{github.repository_owner}}/solar-system:${{ github.sha}}
  
  dev-deploy:
    needs: docker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4     
        
      - name: Install kubectl CLI
        uses: azure/setup-kubectl@v4
        with:
          version: 'v1.26.0' # default is latest stable  
      - name: Fetch Kubernetes Cluster Details
        run: |
           kubectl version --short
           echo ------------------------
           kubectl get nodes     
